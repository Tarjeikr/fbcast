name: forecast
on:
  schedule:
    # GitHub starts scheduled runs late. Every scheduled run of this repository from 4 to 19 Nov 2026 began 4.5 to 10.5 hours
    # after its cron time, so a single slot at the right hour always missed the auction. Instead there is a slot every
    # 30 minutes from 21:07 to 11:37 CET (20:07 to 10:37 UTC), and a run does not need to start at the right moment: any run that
    # starts between 07:30 CET and gate closure waits for JAO to publish the domain (about 09:55 CET) and then issues.
    # A run that starts before 07:30 CET, or after the day's forecast exists, stops at the first step and takes a few seconds.
    - cron: "7,37 0-10,20-23 * * *"
  workflow_dispatch:           # a run started by hand waits too: one tap any time after about 04:30 CET is enough
concurrency:
  group: forecast              # one run at a time, so two runs can never both issue the same day's forecast
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: is there anything to do?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          day=$(TZ=Europe/Berlin date -d tomorrow +%F)
          hhmm=$(TZ=Europe/Berlin date +%H%M)
          if [ -f "forecasts/$day.json" ]; then
            echo "forecast for $day already issued; nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ] && [ "$((10#$hhmm))" -lt 730 ]; then
            echo "$hhmm CET is too early for $day: JAO publishes the domain at about 09:55 CET"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "forecast for $day wanted (started $hhmm CET)"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt opentimestamps-client
      - name: wait until JAO has published the domain for tomorrow
        if: steps.gate.outputs.go == 'true'
        run: |
          python - <<'PY'
          import sys, time
          import pandas as pd
          from fbcast import data
          day = (pd.Timestamp.now(tz="Europe/Berlin") + pd.Timedelta(days=1)).strftime("%Y-%m-%d")
          deadline = time.time() + 330 * 60
          while True:
              try:
                  ok, when = data.domain_published(day)
              except Exception as e:
                  ok, when = False, None
                  print("JAO not answering (%s); will ask again" % type(e).__name__, flush=True)
              if ok:
                  print("domain for", day, "is on JAO, published", when, flush=True)
                  sys.exit(0)
              if time.time() > deadline:
                  print("domain for", day, "not published within 330 minutes; giving up", flush=True)
                  sys.exit(2)
              print(pd.Timestamp.now(tz="Europe/Berlin").strftime("%H:%M CET"), "domain for", day, "not on JAO yet", flush=True)
              time.sleep(240)
          PY
      - name: pick up what was committed during the wait (a retrained model, or a forecast issued by another run)
        if: steps.gate.outputs.go == 'true'
        run: git pull --ff-only origin "$GITHUB_REF_NAME" || echo "could not refresh the checkout; continuing with the files as checked out"
      - if: steps.gate.outputs.go == 'true'
        run: python -m fbcast.forecast --wait-minutes 40
      - name: stamp the forecast on the Bitcoin blockchain (OpenTimestamps)
        if: steps.gate.outputs.go == 'true'
        run: |
          for f in $(git ls-files --others --exclude-standard forecasts | grep '\.json$'); do ots stamp "$f" || true; done
      - name: commit through the GitHub API, so the commit is signed by GitHub
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/api-commit.sh "forecast $(date -u +%Y-%m-%dT%H:%MZ)" $(git ls-files --others --exclude-standard forecasts) $(git diff --name-only forecasts)
