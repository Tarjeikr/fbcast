name: score
on:
  schedule:
    # The day-ahead results are on JAO from about 13:05 CET. GitHub starts the scheduled runs of this repository 4.5 to 10.5
    # hours after their cron time (see forecast.yml), so there are three lines: the first run to start after the results does
    # the scoring; a run that finds nothing new to score only refreshes the "last scoring run" line. Times are UTC.
    - cron: "37 7 * * *"
    - cron: "30 13 * * *"
    - cron: "37 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt opentimestamps-client
      - run: python -m fbcast.score
      - run: python -m fbcast.report
      - name: refresh the book (marks calls in delivery against the published day-ahead prices)
        run: python -m fbcast.book report || echo "book report failed; the scorecard is committed regardless"
      - name: upgrade pending timestamp proofs once their Bitcoin block is confirmed
        run: for f in forecasts/*.ots book/calls/*.ots book/closes/*.ots; do [ -f "$f" ] && ots upgrade "$f" || true; done; rm -f forecasts/*.ots.bak book/calls/*.ots.bak book/closes/*.ots.bak
      - name: commit through the GitHub API, so the commit is signed by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each list on its own line: if git fails, the step fails. (Until 21 Nov 2026 both lists were built inside the
          # command itself; git stopped at the folder book/, which does not exist before the first call, the list came out
          # empty and the run committed nothing while looking fine.) "--" tells git that what follows are paths.
          new=$(git ls-files --others --exclude-standard -- scorecard forecasts BOOK.md)
          changed=$(git diff --name-only -- scorecard forecasts book SCORECARD.md BOOK.md)
          bash .github/api-commit.sh "score $(date -u +%Y-%m-%dT%H:%MZ)" $new $changed
