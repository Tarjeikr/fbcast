name: retrain
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays. GitHub starts scheduled runs hours late; nothing here depends on the exact time.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: reuse the downloaded history (JAO two-day windows, closed price years) from the previous run
        uses: actions/cache/restore@v4
        with:
          path: data
          key: fbcast-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fbcast-data-
      - run: pip install -r requirements.txt
      # Grid model: history from 1 Sep 2026. Fundamentals model: all history since June 2022, with a twelve-month walk-forward
      # backtest. The first run downloads about 4,000 small JAO windows (some ten minutes); later runs only the new days.
      - run: python -m fbcast.train
      - name: commit through the GitHub API, so the commit is signed by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/api-commit.sh "retrain $(date -u +%Y-%m-%dT%H:%MZ)" $(git diff --name-only models) $(git ls-files --others --exclude-standard models)
      - name: keep the downloaded history for the next run, also when this one stopped part-way
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: fbcast-data-${{ github.run_id }}-${{ github.run_attempt }}
