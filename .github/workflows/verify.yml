name: verify
on:
  schedule:
    - cron: "0 3 * * 0"    # Sundays: recompute every scorecard from freshly downloaded public data; fails loudly if anything differs
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m fbcast.score --verify
